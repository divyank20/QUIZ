const refCode = "MB-" + Math.floor(100000 + Math.random() * 900000);
document.getElementById('userRefCode').textContent = refCode;
let current = 0;

function startQuiz() {
    document.getElementById('splash').style.display = 'none';
    document.getElementById('quiz').style.display = 'flex';
    renderQ();
}

function renderQ() {
    let q = ALL_QUESTIONS[current];
    document.getElementById('qText').textContent = q.q;
    let html = "";
    q.opts.forEach((o, i) => html += `<button class="btn" onclick="nextQ()">${o}</button>`);
    document.getElementById('options').innerHTML = html;
}

function nextQ() {
    current++;
    if(current >= 5) { // 5 questions ke baad paywall
        document.getElementById('quiz').style.display = 'none';
        document.getElementById('paywall').style.display = 'flex';
    } else { renderQ(); }
}

function finish() { alert("Verification request bheji gayi!"); }
</script>
